name: Test

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'protocol/**'
      - 'agent/**'
  workflow_dispatch:

jobs:
  sco-protocol:
    name: sco-protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: "**/*.sum"

      - name: Install dependencies
        run: go work sync

      - name: Test sco-protocol
        run: go test ./protocol/... -v

  sco-server:
    name: sco-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: "**/*.sum"

      - name: Install dependencies
        run: go work sync

      - name: Build sco-server
        run: go build ./server/cmd/app/main.go

      - name: Test sco-server
        run: go test ./server/... -v

  sco-agent:
    name: sco-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: "**/*.sum"

      - name: Install dependencies
        run: go work sync

      - name: Build sco-agent
        run: go build ./agent/cmd/app/main.go

      - name: Test sco-agent
        run: go test ./agent/... -v
